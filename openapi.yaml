  /PlaceOrder:
    post:
      tags:
      - Orders & Trades
      summary: Place Order
      operationId: placeOrder
      description: Place an order with the OMS. Use URL-encoding for symbols containing special characters
        (e.g. `M&M`).
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - jData
              properties:
                jData:
                  type: string
                  description: |-
                    JSON payload sent as the `jData` field.

                    | Field | Required | Description |
                    |---|---|---|
                    | `uid` | yes | Logged-in user id |
                    | `actid` | yes | Account id of the logged-in user |
                    | `exch` | yes | Exchange: NSE / NFO / BSE / MCX (see `exarr` in User Details) |
                    | `tsym` | yes | Trading symbol of the contract |
                    | `qty` | yes | Order quantity |
                    | `prc` | yes | Order price |
                    | `trgprc` | no | Trigger price, only for SL-LMT / SL-MKT |
                    | `dscqty` | no | Disclosed quantity (max 10% NSE, 50% MCX) |
                    | `prd` | yes | Product: C / M / H (see `prarr` in User Details) |
                    | `trantype` | yes | B (buy) or S (sell) |
                    | `prctyp` | yes | LMT / MKT / SL-LMT / SL-MKT / DS / 2L / 3L |
                    | `ret` | yes | DAY / EOS / IOC |
                    | `remarks` | no | Your tag for the order |
                    | `ordersource` | no | Set to `API` |
                    | `bpprc` | no | Book profit price (bracket orders) |
                    | `blprc` | no | Book loss price (H and B products) |
                    | `trailprc` | no | Trailing price (H and B products) |
                    | `amo` | no | `Yes` for an after-market order; anything else is a regular order |
                  example: '{"uid":"USER_ID","actid":"USER_ID","exch":"NSE","tsym":"CANBK-EQ","qty":"1","prc":"200.00","trgprc":"199.50","dscqty":"0","prd":"C","trantype":"B","prctyp":"SL-LMT","ret":"DAY","remarks":"my_order_001","ordersource":"API"}'
          text/plain:
            schema:
              type: string
              description: Raw body of the form `jData=<compact JSON>`.
              example: jData={"uid":"USER_ID","actid":"USER_ID","exch":"NSE","tsym":"CANBK-EQ","qty":"1","prc":"200.00","trgprc":"199.50","dscqty":"0","prd":"C","trantype":"B","prctyp":"SL-LMT","ret":"DAY","remarks":"my_order_001","ordersource":"API"}
      responses:
        '200':
          description: 'HTTP 200 is returned for both outcomes. Check `stat`: `Ok` = success, `Not_Ok`
            = failure with `emsg`.'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/OrderPlacedResponse'
                - $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid Bearer token.
      externalDocs:
        description: Documentation page
        url: https://shoonya.com/api-documentation/place-order
  /ModifyOrder:
    post:
      tags:
      - Orders & Trades
      summary: Modify Order
      operationId: modifyOrder
      description: Modify quantity, price type, price or trigger price of an open order.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - jData
              properties:
                jData:
                  type: string
                  description: |-
                    JSON payload sent as the `jData` field.

                    | Field | Required | Description |
                    |---|---|---|
                    | `uid` | yes | Logged-in user id |
                    | `norenordno` | yes | Noren order number to modify |
                    | `exch` | yes | Exchange |
                    | `tsym` | yes | Trading symbol; must match the original order |
                    | `prctyp` | no | LMT / MKT / SL-MKT / SL-LMT |
                    | `prc` | no | New price |
                    | `qty` | no | New quantity |
                    | `trgprc` | no | New trigger price (SL orders) |
                    | `bpprc` | no | Book profit price |
                    | `blprc` | no | Book loss price |
                    | `trailprc` | no | Trailing price |
                  example: '{"uid":"USER_ID","norenordno":"<order_number>","exch":"NSE","tsym":"CANBK-EQ","qty":"2","prctyp":"LMT","prc":"201.00"}'
          text/plain:
            schema:
              type: string
              description: Raw body of the form `jData=<compact JSON>`.
              example: jData={"uid":"USER_ID","norenordno":"<order_number>","exch":"NSE","tsym":"CANBK-EQ","qty":"2","prctyp":"LMT","prc":"201.00"}
      responses:
        '200':
          description: 'HTTP 200 is returned for both outcomes. Check `stat`: `Ok` = success, `Not_Ok`
            = failure with `emsg`.'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/OrderResultResponse'
                - $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid Bearer token.
      externalDocs:
        description: Documentation page
        url: https://shoonya.com/api-documentation/modify-order
