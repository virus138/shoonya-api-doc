openapi: 3.0.3
info:
  title: Shoonya NorenRESTAPI (OAuth)
  version: 1.0.0
  description: |
    Unofficial OpenAPI 3.0 description of the Shoonya (Finvasia) **NorenRESTAPI** with OAuth, generated from the
    `NorenRESTAPI_oAuth` Postman collection and the public documentation. The documentation at
    https://shoonya.com/api-documentation is the source of truth.

    ### Conventions
    - Every endpoint is `POST`.
    - The body carries a single field `jData` holding a **compact JSON string**. Send it as
      `application/x-www-form-urlencoded` (what the Postman collection uses) or as `text/plain` with the body
      `jData=<JSON>` (what the docs show). Do not let your HTTP library URL-encode the JSON a second time.
    - Authentication: `Authorization: Bearer <access_token>`. The token is not repeated in the body.
    - Responses are JSON. Always check `stat` (`Ok` / `Not_Ok`); on failure `emsg` explains why. Numeric values are
      strings.
    - Endpoints marked `x-needs-review` have only `uid` / `actid` documented in the Postman collection.

    ### Getting a token
    1. Send the user to `https://api.shoonya.com/OAuthlogin/authorize/oauth?client_id=<app_key>`.
    2. Take the authorization code from the redirect URL.
    3. Call `GenAcsTok` with `appkey = SHA256(client_id + secret_code + auth_code)`.
  contact:
    name: Shoonya API
    url: https://shoonya.com/api-documentation
externalDocs:
  description: Official Shoonya API documentation
  url: https://shoonya.com/api-documentation
servers:
- url: https://api.shoonya.com/NorenWClientAPI
  description: Shoonya REST gateway
security:
- bearerAuth: []
tags:
- name: Auth & Account
  description: OAuth token exchange, password reset, user and client details, logout.
- name: Watchlist
  description: Market watch lists and scrip search.
- name: Orders & Trades
  description: Place, modify and cancel orders; order book, trade book, margins, product conversion.
- name: Positions, Holdings & Funds
  description: Positions, holdings, limits and payout information.
- name: Reports
  description: Order and trade reports.
- name: Market Data & Reference
  description: Quotes, security info, chart data, option chain and greeks, exchange messages.
paths:
  /GenAcsTok:
    post:
      tags:
      - Auth & Account
      summary: GenAccessToken
      operationId: genAccessToken
      description: Exchange the OAuth authorization code for an access token. The `appkey` field is the
        checksum `SHA256(client_id + secret_code + auth_code)`. The OAuth login page is `https://api.shoonya.com/OAuthlogin/authorize/oauth?client_id=<app_key>`.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - jData
              properties:
                jData:
                  type: string
                  description: |-
                    JSON payload sent as the `jData` field.

                    | Field | Required | Description |
                    |---|---|---|
                    | `uid` | yes | Logged-in user id |
                    | `code` | yes | Authorization code from the redirect URL after login |
                    | `appkey` | yes | Checksum: SHA256(client_id + secret_code + auth_code) |
                    | `apikey` | yes | Vendor API key |
                  example: '{"uid":"USER_ID","code":"<auth_code>","appkey":"<checksum>","apikey":"<vendor_api_key>"}'
          text/plain:
            schema:
              type: string
              description: Raw body of the form `jData=<compact JSON>`.
              example: jData={"uid":"USER_ID","code":"<auth_code>","appkey":"<checksum>","apikey":"<vendor_api_key>"}
      responses:
        '200':
          description: 'HTTP 200 is returned for both outcomes. Check `stat`: `Ok` = success, `Not_Ok`
            = failure with `emsg`.'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/AccessTokenResponse'
                - $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid Bearer token.
      security: []
      externalDocs:
        description: Documentation page
        url: https://shoonya.com/api-documentation/manual-login-oauth
