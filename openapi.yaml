components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access token returned by `GenAcsTok`.
  schemas:
    ErrorResponse:
      type: object
      required:
      - stat
      - emsg
      properties:
        stat:
          type: string
          enum:
          - Not_Ok
        emsg:
          type: string
          description: 'Human-readable error detail, e.g. `Session Expired : Invalid Session Key`.'
        request_time:
          type: string
          description: Server time of the response.
    GenericObject:
      type: object
      description: Endpoint response whose field list is not yet documented in this spec. Check `stat`
        first.
      properties:
        stat:
          type: string
          enum:
          - Ok
