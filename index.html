<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Shoonya API Documentation — Finvasia</title>
<meta name="description" content="Official API documentation for the Shoonya trading platform by Finvasia. Authenticate, place orders, stream live market data, and build algo trading strategies via REST and WebSocket.">
<meta property="og:title" content="Shoonya API Documentation">
<meta property="og:description" content="REST and WebSocket API reference for trading, market data, and account access on Shoonya.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">


<style>
:root{
  --ink:#424241; --orange:#f3a44c; --orange-dark:#f0941f; --grey:#6e6e6e;
  --bg-left:#fbfffa; --bg-right:#d6f7e0;

  --bg:var(--bg-left); --surface:#FFFFFF; --surface-2:#EFFBF1; --surface-3:#E3F5E8;
  --border:#DCEEE0; --text:var(--ink); --text-muted:var(--grey); --text-faint:#7d7e77;
  --accent:var(--orange-dark); --accent-hover:#d97e0f; --accent-soft:#FDEDD9; --accent-soft-text:#a6620d;
  --green:#1E9E5A; --green-soft:#E1F5E7; --red:#D6423C; --red-soft:#FBEAE9; --amber:#B58A1E; --amber-soft:#F7EFD6;
  --radius:10px; --radius-lg:14px;
  --shadow:0 1px 2px rgba(66,66,65,.05), 0 8px 24px -12px rgba(66,66,65,.14);
  --font-display:'Bricolage Grotesque',sans-serif; --font-body:'Figtree',sans-serif; --font-mono:'JetBrains Mono',monospace;
  --focus-ring:0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
}
html[data-theme="dark"]{
  --bg:#1C1E1B; --surface:#242622; --surface-2:#2B2E28; --surface-3:#33362F;
  --border:#3A3D36; --text:#F3F1EA; --text-muted:#B4B6AC; --text-faint:#93958a;
  --accent:var(--orange); --accent-hover:#f7b56b; --accent-soft:#3A2C15; --accent-soft-text:#f3a44c;
  --green:#4FCC8A; --green-soft:#1B3324; --red:#FF6B63; --red-soft:#3A211F; --amber:#E0B84A; --amber-soft:#332A14;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 32px -14px rgba(0,0,0,.5);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:var(--font-body); color:var(--text);
  background:linear-gradient(120deg, var(--bg-left) 0%, var(--bg-left) 45%, var(--bg-right) 100%);
  background-attachment:fixed;
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
html[data-theme="dark"] body{ background:var(--bg); }
h1,h2,h3,.brand,.nav-section-btn,.page-title{ font-family:var(--font-display); }
a{color:inherit; text-decoration:none;}
::selection{background:var(--accent-soft); color:var(--accent-soft-text);}

/* ===== A11Y: per-audit item 6 — visible keyboard focus everywhere ===== */
a:focus-visible, button:focus-visible, input:focus-visible,
.nav-item:focus-visible, .code-tab:focus-visible, .sr-item:focus-visible{
  outline:none; box-shadow:var(--focus-ring); border-radius:6px;
}

/* ===== A11Y: skip-to-content link (audit item 6) ===== */
.skip-link{
  position:absolute; left:-9999px; top:0; z-index:100; background:var(--accent);
  color:#fff; padding:10px 16px; border-radius:0 0 8px 0; font-size:13px; font-weight:600;
}
.skip-link:focus{ left:0; }

/* ===== A11Y: respect reduced-motion (audit item 6) ===== */
@media (prefers-reduced-motion: reduce){
  .nav-items, .chev, .stub-box .pulse{ transition:none !important; animation:none !important; }
}

/* ===== TOP BAR ===== */
.topbar{
  height:56px; border-bottom:1px solid var(--border); background:var(--surface);
  display:flex; align-items:center; gap:16px; padding:0 20px; position:sticky; top:0; z-index:50;
}
.topbar .brand{display:flex; align-items:center; gap:9px; font-weight:800; font-size:15px; letter-spacing:-.01em; white-space:nowrap;}
.brand .logo-img{height:26px; width:auto; display:block;}
.brand .logo-divider{
  font-family:var(--font-body); font-weight:600; font-size:12.5px; color:var(--text-faint);
  padding-left:12px; margin-left:2px; border-left:1px solid var(--border);
}
.hamburger{display:none; background:none; border:none; color:var(--text); cursor:pointer; padding:6px;}
.searchbar{
  flex:1; max-width:480px; display:flex; align-items:center; gap:8px;
  background:var(--surface-2); border:1px solid var(--border); border-radius:8px;
  padding:8px 12px; color:var(--text-muted); cursor:text; position:relative;
}
.searchbar input{
  background:none; border:none; outline:none; color:var(--text); font-size:13.5px; width:100%; font-family:var(--font-body);
}
.searchbar .kbd{font-family:var(--font-mono); font-size:11px; background:var(--surface); border:1px solid var(--border); padding:2px 6px; border-radius:5px; color:var(--text-faint);}
.search-results{
  position:absolute; top:calc(100% + 8px); left:0; right:0; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); box-shadow:var(--shadow); max-height:340px; overflow-y:auto; display:none; z-index:60;
}
.search-results.open{display:block;}
.search-results .sr-item{padding:9px 14px; font-size:13px; cursor:pointer; display:flex; flex-direction:column; gap:2px; border-bottom:1px solid var(--border);}
.search-results .sr-item:last-child{border-bottom:none;}
.search-results .sr-item:hover, .search-results .sr-item.active{background:var(--surface-2);}
.search-results .sr-item mark{background:transparent; color:var(--accent); font-weight:600;}
.search-results .sr-item.sr-empty{cursor:default; color:var(--text-faint);}
.search-results .sr-section{font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.06em;}
.topbar-right{display:flex; align-items:center; gap:10px; margin-left:auto;}
.icon-btn{
  width:34px; height:34px; border-radius:8px; border:1px solid var(--border); background:var(--surface);
  display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-muted);
}
.icon-btn:hover{background:var(--surface-2); color:var(--text);}
.gh-link{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--text-muted); border:1px solid var(--border); padding:7px 12px; border-radius:8px;}
.gh-link:hover{background:var(--surface-2);}

/* ===== LAYOUT ===== */
.layout{display:flex; max-width:1440px; margin:0 auto;}

/* ===== SIDEBAR ===== */
.sidebar{
  width:264px; flex-shrink:0; border-right:1px solid var(--border); background:var(--bg);
  height:calc(100vh - 56px); position:sticky; top:56px; overflow-y:auto; padding:18px 12px 60px;
}
.sidebar::-webkit-scrollbar{width:6px;}
.sidebar::-webkit-scrollbar-thumb{background:var(--border); border-radius:3px;}
.nav-section{margin-bottom:2px;}
.nav-section-btn{
  width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px;
  background:none; border:none; cursor:pointer; padding:9px 8px; font-family:var(--font-display);
  font-size:11.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--text-faint);
}
.nav-section-btn:hover{color:var(--text-muted);}
.nav-section-btn .chev{transition:transform .16s ease; color:var(--text-faint); flex-shrink:0;}
.nav-section-btn .chev.rot{transform:rotate(-90deg);}
.nav-items{overflow:hidden; transition:max-height .2s ease; padding-left:4px; border-left:1px solid var(--border); margin:2px 0 10px 12px;}
.nav-items.collapsed{max-height:0 !important; margin:0 0 0 12px;}
.nav-item{
  display:block; font-size:13.5px; color:var(--text-muted); padding:6.5px 12px; border-radius:7px;
  margin:1px 4px; position:relative; cursor:pointer; transition:background .1s;
}
.nav-item:hover{background:var(--surface-2); color:var(--text);}
.nav-item.active{background:var(--accent-soft); color:var(--accent-soft-text); font-weight:600;}
.nav-item .badge-mini{
  font-family:var(--font-mono); font-size:9px; font-weight:700; padding:1px 5px; border-radius:4px;
  margin-right:6px; vertical-align:1px;
}
.badge-mini.get{background:var(--accent-soft); color:var(--accent-soft-text);}
.badge-mini.post{background:var(--green-soft); color:var(--green);}
.badge-mini.ws{background:var(--amber-soft); color:var(--amber);}

/* ===== MAIN CONTENT ===== */
.main{flex:1; min-width:0; padding:36px 48px 100px; max-width:820px;}
.breadcrumb{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-faint); margin-bottom:18px;}
.breadcrumb .sep{opacity:.6;}
.breadcrumb .current{color:var(--text-muted);}
.page-header{margin-bottom:28px;}
.endpoint-badge{
  display:inline-flex; align-items:center; gap:10px; font-family:var(--font-mono); font-size:13px;
  background:var(--surface-2); border:1px solid var(--border); padding:8px 14px; border-radius:8px; margin-bottom:16px;
}
.method-tag{font-weight:800; font-size:11px; padding:3px 8px; border-radius:5px; letter-spacing:.03em;}
.method-tag.GET{background:var(--accent-soft); color:var(--accent-soft-text);}
.method-tag.POST{background:var(--green-soft); color:var(--green);}
.method-tag.WS{background:var(--amber-soft); color:var(--amber);}
h1.page-title{font-family:var(--font-display); font-size:32px; font-weight:800; letter-spacing:-.02em; margin-bottom:10px;}
.page-desc{color:var(--text-muted); font-size:15.5px; max-width:640px;}
.content-section{margin:36px 0;}
.content-section h2{font-size:19px; font-weight:700; letter-spacing:-.01em; margin-bottom:10px; padding-top:6px; scroll-margin-top:76px;}
.content-section h3{font-size:15px; font-weight:700; margin:18px 0 8px; scroll-margin-top:76px;}
.content-section p{color:var(--text-muted); margin-bottom:12px; font-size:14.5px;}
.content-section ul,.content-section ol{color:var(--text-muted); font-size:14.5px; padding-left:20px; margin-bottom:12px;}
.content-section li{margin-bottom:5px;}

/* param table */
.param-table{width:100%; border-collapse:collapse; font-size:13.5px; margin:14px 0; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;}
.param-table th{background:var(--surface-2); text-align:left; padding:9px 12px; font-weight:600; color:var(--text-muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em;}
.param-table td{padding:10px 12px; border-top:1px solid var(--border);}
.param-table td:first-child{font-family:var(--font-mono); font-size:12.5px; color:var(--accent-soft-text); white-space:nowrap;}
.req-tag{font-size:10px; font-weight:700; padding:1px 6px; border-radius:4px; background:var(--red-soft); color:var(--red);}
.opt-tag{font-size:10px; font-weight:700; padding:1px 6px; border-radius:4px; background:var(--surface-3); color:var(--text-faint);}

/* code block / tabs */
.code-block{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; margin:14px 0; box-shadow:var(--shadow);}
.code-tabs{display:flex; border-bottom:1px solid var(--border); background:var(--surface-2);}
.code-tab{padding:9px 16px; font-size:12.5px; font-weight:600; color:var(--text-faint); cursor:pointer; border-bottom:2px solid transparent;}
.code-tab.active{color:var(--text); border-bottom-color:var(--accent);}
.code-body{position:relative;}
.code-body pre{margin:0; padding:16px; overflow-x:auto; font-size:12.8px; line-height:1.55; font-family:var(--font-mono); background:#0d1117 !important;}
.code-body pre code.hljs{background:transparent !important; padding:0;}
.code-panel{display:none;}
.code-panel.active{display:block;}
.copy-btn{
  position:absolute; top:10px; right:10px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14);
  color:#c9d1d9; font-size:11px; padding:5px 9px; border-radius:6px; cursor:pointer; display:flex; align-items:center; gap:5px;
}
.copy-btn:hover{background:rgba(255,255,255,.16);}
.code-label{font-size:11px; color:var(--text-faint); padding:8px 16px 0; font-family:var(--font-mono);}

/* callouts */
.callout{border-left:3px solid var(--accent); background:var(--accent-soft); border-radius:0 8px 8px 0; padding:12px 16px; margin:16px 0; font-size:13.5px; color:var(--text);}
.callout.warn{border-color:var(--amber); background:var(--amber-soft);}
.callout.error{border-color:var(--red); background:var(--red-soft);}
.callout b{display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px; opacity:.85;}

/* cards */
.card-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:16px 0;}
.mini-card{border:1px solid var(--border); border-radius:var(--radius); padding:13px 15px; background:var(--surface);}
.mini-card .k{font-family:var(--font-mono); font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px;}
.mini-card .v{font-size:13.5px; color:var(--text-muted);}

/* stub / coming soon */
.stub-box{border:1.5px dashed var(--border); border-radius:var(--radius-lg); padding:36px 28px; text-align:center; margin-top:24px;}
.stub-box .pulse{width:8px; height:8px; border-radius:50%; background:var(--amber); display:inline-block; margin-right:7px; animation:pulse 1.6s infinite;}
@keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.35;}}
.stub-box p{color:var(--text-muted); font-size:13.5px; max-width:420px; margin:8px auto 0;}
.stub-box .stub-title{font-weight:700; font-size:14.5px;}
.stub-checklist{list-style:none; display:inline-flex; flex-direction:column; gap:6px; text-align:left; margin-top:16px; font-size:12.5px; color:var(--text-faint);}
.stub-checklist li:before{content:"— "; }

/* utility bar: edit-on-github + feedback */
.util-bar{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-top:48px; padding-top:20px; border-top:1px solid var(--border);}
.edit-link{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-faint);}
.edit-link:hover{color:var(--accent);}
.feedback{display:flex; align-items:center; gap:9px; font-size:12.5px; color:var(--text-muted);}
.feedback button{font-family:var(--font-body); font-size:12px; font-weight:600; color:var(--text-muted); background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:4px 12px; cursor:pointer;}
.feedback button:hover{background:var(--surface-2); color:var(--text);}
.feedback-thanks{color:var(--green); font-weight:600;}

/* footer nav */
.page-nav{display:flex; justify-content:space-between; margin-top:56px; padding-top:24px; border-top:1px solid var(--border); gap:12px;}
.page-nav a{border:1px solid var(--border); border-radius:var(--radius); padding:12px 16px; font-size:13px; flex:1; max-width:48%;}
.page-nav a:hover{background:var(--surface-2);}
.page-nav .lbl{color:var(--text-faint); font-size:11px; margin-bottom:2px;}
.page-nav .nxt{text-align:right;}

/* ===== TOC ===== */
.toc{width:220px; flex-shrink:0; padding:36px 20px 60px 0;}
.toc-inner{position:sticky; top:76px;}
.toc-title{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); margin-bottom:10px;}
.toc a{display:block; font-size:12.8px; color:var(--text-muted); padding:5px 0 5px 12px; border-left:2px solid var(--border);}
.toc a:hover{color:var(--text);}
.toc a.active{color:var(--accent); border-left-color:var(--accent); font-weight:600;}

/* responsive */
.sidebar-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:39;}
@media (max-width:1180px){ .toc{display:none;} .main{max-width:100%;} }
@media (max-width:880px){
  .hamburger{display:flex; align-items:center;}
  .sidebar{position:fixed; left:-280px; top:56px; height:calc(100vh - 56px); width:264px; z-index:40; transition:left .2s ease; box-shadow:var(--shadow);}
  .sidebar.open{left:0;}
  .sidebar-overlay.open{display:block;}
  .main{padding:24px 20px 80px;}
  .searchbar{max-width:none;}
  .brand span.full{display:none;}
}
</style>
</head>
