name: Lint OpenAPI spec

on:
  push:
    paths:
      - 'docs/openapi.yaml'
  pull_request:
    paths:
      - 'docs/openapi.yaml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lint with Redocly
        run: npx --yes @redocly/cli@1.34.5 lint docs/openapi.yaml
